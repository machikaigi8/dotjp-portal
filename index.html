
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>dotjp portal｜ログイン</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px; background: #f2f2ff;
      color: #121252; font-family: "Segoe UI", "Yu Gothic", sans-serif;
    }
    main {
      width: min(100%, 490px); padding: 50px 35px; text-align: center;
      background: white; border: 3px solid #283dff;
    }
    h1 { margin: 0 0 12px; font-size: 34px; }
    p { font-size: 17px; line-height: 1.7; }
    a.login {
      display: block; margin: 32px auto 0; padding: 16px 20px;
      background: #283dff; color: white; text-decoration: none;
      font-size: 22px; font-weight: 700;
    }
    a.login:focus-visible { outline: 4px solid #40ccff; outline-offset: 3px; }
    small { display: block; margin-top: 22px; color: #555; line-height: 1.6; }
    #error { color: #b3261e; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>dotjp portal</h1>
    <p>ドットジェイピー ポータル</p>
    <p id="error" role="alert" hidden></p>
    <a class="login" href="https://dotjp-login.taka-souda516.workers.dev/auth/google">
      Googleでログイン
    </a>
    <small>組織アカウント（@dot-jp.or.jp）でログインしてください。</small>
  </main>
  <script>
    const errorCode = new URLSearchParams(location.search).get('error');
    if (errorCode) {
      const error = document.getElementById('error');
      error.hidden = false;
      const messages = {
        google_cancelled: 'Googleログインがキャンセルされました。',
        domain_denied: '組織アカウントでログインしてください。',
        oauth_expired: 'ログインが期限切れです。もう一度お試しください。',
        oauth_state: 'ログインを確認できませんでした。もう一度お試しください。',
        token_exchange: 'Googleとの認証に失敗しました。'
      };
      error.textContent = messages[errorCode] ||
        'ログインが完了しませんでした。もう一度お試しください。';
    }
  </script>
</body>
</html>
