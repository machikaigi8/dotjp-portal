<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>2段階認証 | ドットジェイピー</title>
<style>
:root{font-family:Inter,"Noto Sans JP",system-ui,sans-serif;color:#202d56;background:#f2f2ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
main{width:min(100%,540px);background:white;padding:34px 36px 30px;border:1px solid #d9e1f5;border-radius:14px;box-shadow:0 16px 42px rgba(34,45,90,.10)}
h1{font-size:25px;line-height:1.45;margin:0 0 11px}
p{font-size:15px;line-height:1.8;color:#58637e}
.caption{margin-top:0}
label.field{display:block;font-size:16px;font-weight:650;margin:24px 0 8px}
input[type=text]{width:100%;padding:13px 16px;border:1px solid #97a9cc;border-radius:7px;font-size:29px;text-align:center;letter-spacing:.25em;color:#1d2950;background:#fbfcff}
input[type=text]:focus{outline:3px solid #d2e5ff;border-color:#397bd3}
button.primary{display:block;width:100%;padding:15px 20px;background:#345ce9;color:#fff;border:0;border-radius:7px;font-size:18px;font-family:inherit;font-weight:700;cursor:pointer;margin-top:21px}
button.primary:disabled{opacity:.58;cursor:wait}
.check{display:flex;align-items:flex-start;gap:13px;padding:14px;background:#f3f6ff;border-radius:8px;margin-top:18px;cursor:pointer}
.check input{width:20px;height:20px;flex-shrink:0;accent-color:#345ce9;margin-top:4px}
.check strong{display:block;font-size:16px}
.check small{display:block;color:#63708b;line-height:1.6;margin-top:4px}
#setupBlock{margin-top:16px;background:#f8fbff;border:1px solid #dae5f4;border-radius:9px;padding:20px}
#setupBlock h2{font-size:18px;margin:0 0 8px}
.secret{display:flex;gap:8px;align-items:stretch}
#secret{font-size:16px;letter-spacing:.05em;text-align:left;overflow-wrap:anywhere;min-width:0;flex:1;padding:12px;background:white;border:1px solid #bdcce5;border-radius:5px;user-select:all;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
button.secondary{padding:10px 13px;border:1px solid #a7bee6;border-radius:6px;background:#e8f0ff;color:#234b88;font-weight:600;cursor:pointer}
a{color:#315dc5}
#status{font-size:14px;min-height:24px;line-height:1.7;margin-bottom:0}
#status.is-error{color:#ba2343}
#status.is-success{color:#1d7752}
footer{margin-top:18px;font-size:13px;text-align:center;color:#79839b}
[hidden]{display:none!important}
@media(max-width:510px){main{padding:25px 21px}h1{font-size:22px}}
</style>
</head>
<body>
<main>
<h1 id="authHeading">ログインしています…</h1>
<p class="caption" id="description">この端末の信頼情報を確認しています。</p>
<section id="setupBlock" hidden>
<h2>認証アプリの登録</h2>
<p>2FASなどの認証アプリで下のQRコードを読み取ってください。読み取れない場合は「手動でキーを入力」で設定できます。キーは他の人に教えないでください。</p>
<div id="qr" aria-label="認証アプリ登録用QRコード"></div>
<div class="secret"><output id="secret"></output><button type="button" class="secondary" id="copySecret">コピー</button></div>
<p><a id="appLink" href="#">この端末の認証アプリで開く</a></p>
<p>登録できたら、アプリに表示される6桁のコードを入力してください。</p>
</section>
<form id="verifyForm" autocomplete="off" hidden>
<label class="field" for="code">認証アプリの6桁コード</label>
<input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required>
<label class="check"><input id="trustDevice" type="checkbox"><span><strong>この端末を信頼する</strong><small>次回以降は原則として認証アプリの入力を省略します。共用端末ではチェックしないでください。</small></span></label>
<button class="primary" type="submit" id="verifyButton">認証してログイン</button>
</form>
<p id="status" role="status">認証情報を確認しています…</p>
<footer>Googleアカウントへのログインは引き続き必要です。</footer>
</main>
<script>
function localQrSvg(input){
  const dataBytes=new TextEncoder().encode(String(input));
  const version=10,size=4*version+17,blockSizes=[68,68,69,69],eccLength=18;
  const capacity=274;
  const bits=[];
  const pushBits=(value,length)=>{for(let i=length-1;i>=0;i--)bits.push((value>>>i)&1)};
  pushBits(0x4,4);pushBits(dataBytes.length,16);
  for(const b of dataBytes)pushBits(b,8);
  if(bits.length>capacity*8)throw new Error('QRコードの内容が長すぎます。');
  for(let i=0;i<4&&bits.length<capacity*8;i++)bits.push(0);
  while(bits.length%8)bits.push(0);
  let next=0xEC;
  while(bits.length<capacity*8){pushBits(next,8);next=next===0xEC?0x11:0xEC;}
  const data=[];
  for(let i=0;i<bits.length;i+=8){let v=0;for(let j=0;j<8;j++)v=(v<<1)|bits[i+j];data.push(v);}
  function mul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x;}return z;}
  const gen=[1];
  for(let i=0;i<eccLength;i++){
    let root=1;for(let j=0;j<i;j++)root=mul(root,2);
    const nextGen=new Array(gen.length+1).fill(0);
    for(let j=0;j<gen.length;j++){nextGen[j]^=gen[j];nextGen[j+1]^=mul(gen[j],root);}
    gen.splice(0,gen.length,...nextGen);
  }
  const blocks=[],eccBlocks=[];let pos=0;
  for(const len of blockSizes){
    const block=data.slice(pos,pos+len);pos+=len;blocks.push(block);
    const rem=new Array(eccLength).fill(0);
    for(const b of block){const factor=b^rem.shift();rem.push(0);for(let j=0;j<eccLength;j++)rem[j]^=mul(gen[j+1],factor);}
    eccBlocks.push(rem);
  }
  const codewords=[];
  for(let j=0;j<Math.max(...blockSizes);j++)for(const block of blocks)if(j<block.length)codewords.push(block[j]);
  for(let j=0;j<eccLength;j++)for(const ecc of eccBlocks)codewords.push(ecc[j]);
  const modules=Array.from({length:size},()=>Array(size).fill(false));
  const reserved=Array.from({length:size},()=>Array(size).fill(false));
  const set=(x,y,dark)=>{if(x<0||y<0||x>=size||y>=size)return;modules[y][x]=!!dark;reserved[y][x]=true;};
  const finder=(cx,cy)=>{for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++){
    const d=Math.max(Math.abs(x),Math.abs(y));set(cx+x,cy+y,d!==2&&d!==4);
  }};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  for(let i=8;i<size-8;i++){set(6,i,i%2===0);set(i,6,i%2===0);}
  for(const cx of [6,28,50])for(const cy of [6,28,50]){
    if((cx===6&&cy===6)||(cx===6&&cy===50)||(cx===50&&cy===6))continue;
    for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
      set(cx+dx,cy+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
    }
  }
  const getBit=(x,i)=>(x>>>i)&1;
  function drawFormat(mask){
    const format=(1<<3)|mask;let rem=format;
    for(let i=0;i<10;i++)rem=(rem<<1)^((rem>>>9)*0x537);
    const raw=(format<<10|rem)^0x5412;
    for(let i=0;i<=5;i++)set(8,i,getBit(raw,i));
    set(8,7,getBit(raw,6));set(8,8,getBit(raw,7));set(7,8,getBit(raw,8));
    for(let i=9;i<15;i++)set(14-i,8,getBit(raw,i));
    for(let i=0;i<8;i++)set(size-1-i,8,getBit(raw,i));
    for(let i=8;i<15;i++)set(8,size-15+i,getBit(raw,i));
    set(8,size-8,true);
  }
  function drawVersion(){let rem=version;for(let i=0;i<12;i++)rem=(rem<<1)^((rem>>>11)*0x1F25);
    const raw=(version<<12)|rem;
    for(let i=0;i<18;i++){
      const bit=getBit(raw,i),a=size-11+i%3,b=Math.floor(i/3);
      set(a,b,bit);set(b,a,bit);
    }
  }
  drawFormat(0);drawVersion();
  let bitIndex=0;
  for(let right=size-1;right>=1;right-=2){
    if(right===6)right=5;
    const upward=((right+1)&2)===0;
    for(let vert=0;vert<size;vert++){
      const y=upward?size-1-vert:vert;
      for(let j=0;j<2;j++){
        const x=right-j;
        if(reserved[y][x])continue;
        const index=Math.floor(bitIndex/8),shift=7-(bitIndex%8);
        let bit=index<codewords.length?((codewords[index]>>>shift)&1):0;
        if((x+y)%2===0)bit^=1;
        modules[y][x]=!!bit;bitIndex++;
      }
    }
  }
  const quiet=4,path=[];
  for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(modules[y][x])path.push(`M${x+quiet},${y+quiet}h1v1h-1z`);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${size+quiet*2} ${size+quiet*2}`);
  svg.setAttribute('role','img');svg.setAttribute('aria-label','認証アプリの登録QRコード');
  svg.setAttribute('width','220');svg.setAttribute('height','220');
  svg.style.cssText='display:block;background:#fff;margin:12px auto;max-width:100%;image-rendering:pixelated';
  const shape=document.createElementNS('http://www.w3.org/2000/svg','path');
  shape.setAttribute('d',path.join(''));shape.setAttribute('fill','#172950');svg.appendChild(shape);
  return svg;
}

(()=>{
  const WORKER='https://dotjp-login.taka-souda516.workers.dev';
  const HOME='https://dotjp-cp-portal.pages.dev/home.html';
  const $=id=>document.getElementById(id);
  const hash=new URLSearchParams(location.hash.slice(1));
  const ticket=hash.get('ticket')||sessionStorage.getItem('dotjp_2fa_ticket_v2')||'';
  if(hash.get('ticket')){
    sessionStorage.setItem('dotjp_2fa_ticket_v2',ticket);
    history.replaceState(null,'',location.pathname);
  }
  const setStatus=(text,error=false)=>{$('status').textContent=text;$('status').classList.toggle('is-error',error)};
  const setBusy=busy=>{$('verifyButton').disabled=busy};
  async function api(path,data){
    const r=await fetch(WORKER+path,{method:'POST',cache:'no-store',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)throw new Error(j.error||'認証サーバーに接続できませんでした。');
    return j;
  }
  function ticketSubject(){
    try{
      const payload=JSON.parse(atob(ticket.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')));
      return typeof payload.sub==='string'&&payload.sub.length>0?payload.sub:null;
    }catch{return null;}
  }
  function deviceDatabase(){
    return new Promise((resolve,reject)=>{
      if(!window.indexedDB)return reject(new Error('device_storage_unavailable'));
      const request=indexedDB.open('dotjp_portal_trusted_keys',1);
      request.onupgradeneeded=()=>{
        if(!request.result.objectStoreNames.contains('devices'))request.result.createObjectStore('devices');
      };
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error||new Error('device_storage_error'));
      request.onblocked=()=>reject(new Error('device_storage_blocked'));
    });
  }
  async function readStoredDevice(){
    const sub=ticketSubject();if(!sub)return null;
    const db=await deviceDatabase();
    try{return await new Promise((resolve,reject)=>{
      const req=db.transaction('devices','readonly').objectStore('devices').get(sub);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error||new Error('read_failed'));
    });}finally{db.close();}
  }
  async function saveStoredDevice(id,privateKey){
    const sub=ticketSubject();if(!sub)throw new Error('invalid_account');
    const db=await deviceDatabase();
    try{await new Promise((resolve,reject)=>{
      const transaction=db.transaction('devices','readwrite');
      transaction.objectStore('devices').put({device_id:id,private_key:privateKey},sub);
      transaction.oncomplete=()=>resolve();
      transaction.onerror=()=>reject(transaction.error||new Error('save_failed'));
      transaction.onabort=()=>reject(transaction.error||new Error('save_aborted'));
    });}finally{db.close();}
  }
  async function clearStoredDevice(){
    const sub=ticketSubject();if(!sub)return;
    const db=await deviceDatabase();
    try{await new Promise((resolve,reject)=>{
      const transaction=db.transaction('devices','readwrite');
      transaction.objectStore('devices').delete(sub);
      transaction.oncomplete=()=>resolve();
      transaction.onerror=()=>reject(transaction.error||new Error('delete_failed'));
      transaction.onabort=()=>reject(transaction.error||new Error('delete_aborted'));
    });}finally{db.close();}
  }
  function encodeBase64Url(bytes){
    let binary='';for(const byte of new Uint8Array(bytes))binary+=String.fromCharCode(byte);
    return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');
  }
  async function proveTrustedDevice(device){
    const challenge=await api('/api/trusted-device/key-challenge',{ticket,device_id:device.device_id});
    const proof=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},device.private_key,
      new TextEncoder().encode(challenge.nonce));
    const verified=await api('/api/trusted-device/key-verify',{ticket,device_id:device.device_id,
      challenge_id:challenge.challenge_id,signature:encodeBase64Url(proof)});
    if(!verified.token)throw new Error('missing_token');
    return verified;
  }
  async function tryTrustedLogin(){
    let device;
    try{device=await readStoredDevice();}catch{return false;}
    if(!device||!device.device_id||!device.private_key)return false;
    try{
      const verified=await proveTrustedDevice(device);
      sessionStorage.removeItem('dotjp_2fa_ticket_v2');
      location.replace(HOME+'#login_token='+encodeURIComponent(verified.token));
      return true;
    }catch(error){
      if(['untrusted_device','invalid_device','invalid_device_proof'].includes(error?.message)){
        try{await clearStoredDevice();}catch{}
      }
      return false;
    }
  }
  async function load(){
    if(!ticket){setStatus('ログイン情報がありません。Googleログインからやり直してください。',true);setBusy(true);return;}
    setStatus('この端末の信頼情報を確認しています…');
    if(await tryTrustedLogin())return;
    $('authHeading').textContent='2段階認証';
    $('verifyForm').hidden=false;
    try{
      const d=await api('/api/2fa/setup',{ticket});
      if(d.secret){
        $('setupBlock').hidden=false;
        $('qr').replaceChildren();
        try{$('qr').appendChild(localQrSvg(d.otpauth_uri));}catch{}
        $('secret').textContent=d.secret;
        $('appLink').href=d.otpauth_uri;
        $('description').textContent='認証アプリを設定し、表示された6桁コードを入力してください。';
      }else{
        $('setupBlock').hidden=true;
        $('description').textContent=d.enabled
          ?'登録済みの認証アプリを開いて、6桁コードを入力してください。'
          :'以前登録した認証アプリの6桁コードを入力してください。';
      }
      setStatus('この端末を信頼すると、次回以降は原則として認証コードを省略できます。ブラウザの保存データを消すと、再認証が必要になります。');
      $('code').focus();
    }catch(e){setStatus(e.message,true);setBusy(true);}
  }
  $('copySecret').addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText($('secret').textContent);setStatus('設定キーをコピーしました。');}
    catch{setStatus('コピーできませんでした。設定キーを手動で選択してください。',true);}
  });
  $('verifyForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const code=$('code').value.replace(/\D/g,'');
    if(!/^\d{6}$/.test(code)){setStatus('6桁の認証コードを入力してください。',true);return;}
    setBusy(true);setStatus('認証中です…');
    try{
      let generated=null;
      if($('trustDevice').checked){
        try{
          const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},false,['sign','verify']);
          const db=await deviceDatabase();db.close();
          generated={privateKey:pair.privateKey,publicJwk:await crypto.subtle.exportKey('jwk',pair.publicKey)};
        }catch{generated=null;}
      }
      const d=await api('/api/2fa/verify',{ticket,code,trust_device:$('trustDevice').checked,
        ...(generated?{trust_public_key:generated.publicJwk}:{})});
      if(!d.token)throw new Error('ログイン情報を発行できませんでした。');
      if(d.trusted_device_key_id){
        try{
          await saveStoredDevice(d.trusted_device_key_id,generated.privateKey);
          await proveTrustedDevice({device_id:d.trusted_device_key_id,private_key:generated.privateKey});
        }catch(error){
          try{
            const auth=await fetch(WORKER+'/api/trusted-devices/revoke',{method:'POST',
              headers:{'Content-Type':'application/json',Authorization:'Bearer '+d.token},
              body:JSON.stringify({device_id:d.trusted_device_key_id})});
            if(!auth.ok)console.warn('Device registration could not be rolled back.');
          }catch{}
          try{await clearStoredDevice();}catch{}
          alert('端末登録の保存・確認に失敗しました。今回はログインできますが、次回も認証コードが必要になる可能性があります。');
        }
        sessionStorage.removeItem('dotjp_2fa_ticket_v2');
        location.replace(HOME+'#login_token='+encodeURIComponent(d.token));
      }else if($('trustDevice').checked&&d.trust_activation_url){
        sessionStorage.removeItem('dotjp_2fa_ticket_v2');
        const url=new URL(d.trust_activation_url);
        if(url.origin!==WORKER)throw new Error('認証先を確認できませんでした。');
        location.replace(url.href);
      }else{
        sessionStorage.removeItem('dotjp_2fa_ticket_v2');
        location.replace(HOME+'#login_token='+encodeURIComponent(d.token));
      }
    }catch(e){setStatus(e.message,true);setBusy(false);}
  });
  load();
})();
</script>
</body>
</html>
